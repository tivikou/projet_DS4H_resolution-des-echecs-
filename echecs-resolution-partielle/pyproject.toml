[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echecs-resolution-partielle"
version = "0.1.0"
description = "Résolution pratique d'une sous-partie du jeu d'échecs : tables Syzygy + oracle Stockfish"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["chess>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
